# Publishes downloadable builds whenever a version tag (v1.2.3) is pushed, so every
# version stays downloadable from the Releases page — the in-game updater reads these.
# Builds the desktop app on Windows, macOS and Linux, plus the source zip with launchers.
# Can also be run by hand from the Actions tab (it then uploads build artifacts only).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package desktop app
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.tar.gz
            release/*-mac-*.zip
          if-no-files-found: error

  release:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source zip (play in the browser with the launchers)
        run: |
          NAME="ScamCallCenter-${GITHUB_REF_NAME}-browser"
          git archive --format=zip --prefix="${NAME}/" -o "${NAME}.zip" HEAD
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            out/*
          generate_release_notes: true
